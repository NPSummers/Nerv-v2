[package]
name = "nerv-runtime"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
reqwest = { optional = true, version = "=0.12.28", default-features = false, features = ["blocking", "rustls-tls"] }
rustls = { optional = true, version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde_json = { version = "=1.0.154", features = ["arbitrary_precision"] }
tungstenite = { optional = true, version = "=0.28.0", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }
webpki-roots = { version = "=1.0.9", optional = true }

[lib]
crate-type = ["rlib", "staticlib"]

[features]
default = ["networking"]
networking = ["dep:reqwest", "dep:rustls", "dep:tungstenite", "dep:webpki-roots"]
