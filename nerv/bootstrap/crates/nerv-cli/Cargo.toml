[package]
name = "nerv"
version = "1.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
nerv-jit = { path = "../nerv-jit" }
nerv-lexer = { path = "../nerv-lexer" }
nerv-sema = { path = "../nerv-sema" }
nerv-syntax = { path = "../nerv-syntax" }
sha2 = "=0.10.9"
toml = "=0.8.23"

[target.'cfg(windows)'.dependencies]
find-msvc-tools = "=0.1.13"

[dev-dependencies]
rcgen = "=0.14.5"
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
tungstenite = { version = "=0.28.0", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }
