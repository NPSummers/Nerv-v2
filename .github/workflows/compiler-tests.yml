name: Compiler tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workspace:
    name: Full suite (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14-arm64, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.0
      - name: Install macOS LLVM dependency
        if: runner.os == 'macOS'
        run: brew install zstd
      - name: Test macOS workspace
        if: runner.os == 'macOS'
        run: bash ./test.sh
      - name: Test Windows workspace
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\test.ps1

  linux-frontend:
    name: Linux frontend and runtime (no LLVM)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.0
      - name: Test LLVM-independent crates
        run: cargo test --locked -p nerv-lexer -p nerv-syntax -p nerv-sema -p nerv-runtime
